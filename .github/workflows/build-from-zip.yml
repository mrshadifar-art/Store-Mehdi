name: Build Store Mehdi APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q StoreMehdi_Android_Project.zip
          echo "PROJECT_DIR=$PWD/StoreMehdiAndroid" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'

      - name: Build APK
        working-directory: StoreMehdiAndroid
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: StoreMehdi-APK
          path: StoreMehdiAndroid/app/build/outputs/apk/debug/app-debug.apk
